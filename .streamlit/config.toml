[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Bind explicitly when deploying; local default is fine for demos.
# address = "0.0.0.0"
# port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f0f2f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
